    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f0f5;
        }

        /* Container */
        .container {
            width: 80%;
            margin: 50px auto;
            background: #f4f4f4;
            padding: 30px;
            border-radius: 8px;
        }

        /* Filter */
        .filter-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-section input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            font-weight: 500;
        }

        /* Gradient buttons */
        .apply {
            background: linear-gradient(to right, #7a4ef3, #a85cf9);
        }

        .reset {
            background: linear-gradient(to right, #e254c8, #ff69d5);
        }

        /* Table */
        table {
            width: 100%;
            margin-top: 30px;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            font-weight: 600;
            color: #666;
            cursor: pointer;
        }

        tr:hover {
            background: #f9f9f9;
        }

        /* Checkbox */
        td input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* Action cell (checkbox + edit) */
        .action-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Edit icon */
        .edit {
            cursor: pointer;
            font-size: 14px;
            color: #4b6bff;
            transition: 0.2s;
        }

        .edit:hover {
            transform: scale(1.2);
            opacity: 0.8;
        }

        /* Delete */
        .delete {
            color: #ff4d4d;
            cursor: pointer;
            font-size: 16px;
        }

        /* Completed row */
        .completed-row {
            opacity: 0.6;
        }

        .completed-row td:nth-child(2) {
            text-decoration: line-through;
            color: #999;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            right: -400px;
            top: 0;
            width: 350px;
            height: 100%;
            background: white;
            padding: 25px;
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.2);
            transition: 0.3s ease;
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar textarea {
            width: 100%;
            height: 150px;
            margin-top: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        /* Sidebar buttons */
        .sidebar-buttons {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
        }

        .save {
            background: linear-gradient(to right, #7a4ef3, #a85cf9);
        }

        .close {
            background: linear-gradient(to right, #e254c8, #ff69d5);
        }
        .caret {
    display: inline-block;
    margin-left: 6px;
    width: 6px;
    height: 6px;
    border-right: 1.5px solid #999;
    border-bottom: 1.5px solid #999;
    transform: rotate(45deg); /* default ↓ */
    transition: 0.2s;
}

/* Up arrow */
.caret.up {
    transform: rotate(-135deg);
}
    </style>
</head>

<body>

    <div class="container">
        <strong>Creation Date</strong>
        <div class="filter-section">
            <!-- <strong>Creation Date</strong> -->
            <input type="date" id="fromDate">
            <span> - </span>
            <input type="date" id="toDate">
            <button class="btn apply" onclick="applyFilter()">APPLY</button>
            <button class="btn reset" onclick="resetFilter()">RESET</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th></th>
<th onclick="sortByName()">
    Name <span id="nameArrow" class="caret"></span>
</th>

<th onclick="sortByDate()">
    Creation Date <span id="dateArrow" class="caret"></span>
</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="todoBody"></tbody>
        </table>

    </div>

    <div class="sidebar" id="sidebar">
        <h3>Description</h3>
        <textarea id="descriptionBox"></textarea>

        <div class="sidebar-buttons">
            <button class="btn save" onclick="saveDescription()">SAVE</button>
            <button class="btn close" onclick="closeSidebar()">CLOSE</button>
        </div>
    </div>

    <script>
        let todos = [];
        let currentData = [];
        let selectedId = null;


        let sortDirections = {
            name: 1,
            date: 1
        };

        async function fetchTodos() {
            const savedData = localStorage.getItem("myTodos");
            if (savedData) {
                todos = JSON.parse(savedData);
                currentData = [...todos];
                renderTable(currentData);
                return;
            }

            const response = await fetch("https://jsonplaceholder.typicode.com/todos?_limit=20");
            const data = await response.json();

            todos = data.map(item => ({
                id: item.id,
                name: item.title,
                date: generateRandomDate(),
                completed: item.completed
            }));

            saveToLocalStorage();
            currentData = [...todos];
            renderTable(currentData);
        }



        function sortByName() {
            sortDirections.name *= -1;
            currentData.sort((a, b) => {
                return sortDirections.name * a.name.localeCompare(b.name);
            });
            renderTable(currentData, true);
        }

        function sortByDate() {
            sortDirections.date *= -1;
            currentData.sort((a, b) => {
                const dateA = new Date(a.date);
                const dateB = new Date(b.date);
                return sortDirections.date * (dateA - dateB);
            });
            renderTable(currentData, true);
        }

        // --- RENDER FUNCTION ---

        function renderTable(data, isAlreadySorted = false) {

            if (!isAlreadySorted) {
                data.sort((a, b) => a.id - b.id);
            }

            const tbody = document.getElementById("todoBody");
            tbody.innerHTML = "";

            data.forEach(todo => {
                const row = document.createElement("tr");
                if (todo.completed) row.classList.add("completed");


                const checkboxTd = document.createElement("td");
                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = todo.completed;
                checkbox.addEventListener("change", function () {
                    todo.completed = checkbox.checked;
                    saveToLocalStorage();
                    if (todo.completed) {
                        row.classList.add("completed");
                    } else {
                        row.classList.remove("completed");
                    }
                });

                const editBtn = document.createElement("span");

                editBtn.innerHTML = `
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
    viewBox="0 0 16 16">
    <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293z"/>
    <path d="M13.752 4.396l-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
    <path d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
</svg>
`;

                editBtn.classList.add("edit");
                editBtn.onclick = () => openSidebar(todo.id);

                checkboxTd.appendChild(checkbox);
                checkboxTd.appendChild(editBtn);

                const nameTd = document.createElement("td");
                nameTd.textContent = todo.name;

                const dateTd = document.createElement("td");
                dateTd.textContent = new Date(todo.date).toLocaleDateString("en-GB");

                const deleteTd = document.createElement("td");
                const deleteBtn = document.createElement("span");
                deleteBtn.textContent = "🗑";
                deleteBtn.classList.add("delete");
                deleteBtn.onclick = () => deleteItem(todo.id);
                deleteTd.appendChild(deleteBtn);

                row.append(checkboxTd, nameTd, dateTd, deleteTd);
                tbody.appendChild(row);
            });
        }


        fetchTodos();

        function openSidebar(id) {
            selectedId = id;
            const todo = todos.find(t => t.id === id);
            document.getElementById("descriptionBox").value = todo.name;
            document.getElementById("sidebar").classList.add("active");
        }
        function saveDescription() {

            const newValue = document.getElementById("descriptionBox").value;

            const todo = todos.find(t => t.id === selectedId);

            if (todo) {
                todo.name = newValue;
                saveToLocalStorage();
            }

            currentData = [...todos];
            renderTable(currentData);
            closeSidebar();
        }

        function deleteItem(id) {
            todos = todos.filter(t => t.id !== id);
            saveToLocalStorage();
            currentData = [...todos];
            renderTable(currentData);
        }



        function applyFilter() {

            const fromValue = document.getElementById("fromDate").value;
            const toValue = document.getElementById("toDate").value;


            currentData = todos.filter(todo => {
                const itemDate = todo.date;
                const matchesFrom = !fromValue || itemDate >= fromValue;
                const matchesTo = !toValue || itemDate <= toValue;
                return matchesFrom && matchesTo;
            });
            renderTable(currentData, true);
            if (currentData.length === 0) {
                document.getElementById("todoBody").innerHTML = "<tr><td colspan='4' style='text-align:center;'>No records found for this range.</td></tr>";
            }
        }

        function resetFilter() {

            document.getElementById("fromDate").value = "";
            document.getElementById("toDate").value = "";
            currentData = [...todos];
            renderTable(currentData);
        }
        function saveToLocalStorage() {
            localStorage.setItem("myTodos", JSON.stringify(todos));
        }
        function closeSidebar() {
            document.getElementById("sidebar").classList.remove("active");
        }

        let nameAsc = false;
let dateAsc = false;

function resetArrows() {
    document.getElementById("nameArrow").classList.remove("up");
    document.getElementById("dateArrow").classList.remove("up");
}

function sortByName() {
    nameAsc = !nameAsc;
    resetArrows();

    if (nameAsc) {
        document.getElementById("nameArrow").classList.add("up");
    }

    todos.sort((a, b) =>
        nameAsc
            ? a.title.localeCompare(b.title)
            : b.title.localeCompare(a.title)
    );

    renderTodos();
}

function sortByDate() {
    dateAsc = !dateAsc;
    resetArrows();

    if (dateAsc) {
        document.getElementById("dateArrow").classList.add("up");
    }

    todos.sort((a, b) =>
        dateAsc
            ? new Date(a.creationDate) - new Date(b.creationDate)
            : new Date(b.creationDate) - new Date(a.creationDate)
    );

    renderTodos();
}
    </script>
